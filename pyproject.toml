[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pramaan-btp"
version = "3.8.0"
description = "Pramaan: multilingual web evidence retrieval, grounded synthesis and a local browser website"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.urls]
Repository = "https://github.com/akshayv12/pramaan-btp"
Issues = "https://github.com/akshayv12/pramaan-btp/issues"

[project.scripts]
btp-task5 = "task5.handoff:main"
btp-task5-evaluate = "task5.evaluation:main"

[tool.setuptools]
package-dir = {"" = "task5_standalone"}

[tool.setuptools.packages.find]
where = ["task5_standalone"]
include = ["task5*"]

[tool.setuptools.package-data]
task5 = ["support_policy.json"]
